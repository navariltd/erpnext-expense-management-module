[project]
name = "erpnext_expenses"
authors = [
    { name = "Karani Geoffrey", email = "karani@upeosoft.com"}
]
description = "A module to capture Expenses in ERPNext"
requires-python = ">=3.10"
readme = "README.md"
version = "0.0.1"
dependencies = [
    "frappe>=16.0.0.dev0,<17.0.0.dev0",
    "pypika @ git+https://github.com/frappe/pypika@2c50e6142b2d61d2d243e466fdd5dc03b3d918f2",
    "gunicorn @ git+https://github.com/frappe/gunicorn@bb554053bb87218120d76ab6676af7015680e8b6",
    "python-magic~=0.4.24"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
